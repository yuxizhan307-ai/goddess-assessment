  .scene::after{
    content:'';
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(22,42,84,0) 0%,rgba(22,42,84,0) 46%,rgba(22,42,84,.3) 60%,rgba(22,42,84,.44) 100%),
               linear-gradient(180deg,rgba(22,42,84,.32) 0%,rgba(22,42,84,0) 11%,rgba(22,42,84,0) 56%,rgba(22,42,84,.3) 100%);
  }
  /* 桌面端：整幅长图海报固定 9:16，场景铺满 */
  @media (min-width:700px){
    .poster{aspect-ratio:9/16;overflow:hidden;}
    .scene{inset:0;width:100%;height:100%;aspect-ratio:auto;}
  }
  .content{
    position:relative;z-index:2;
    display:flex;flex-direction:column;
    padding:clamp(13px,2.4cqw,32px) clamp(18px,4cqw,50px) clamp(10px,1.8cqw,24px);
  }
  /* ---------- 标题区：全横 深灰蓝+白晕 ---------- */
  .hd{flex:0 0 auto;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;}
  h1{
    font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
    font-weight:700;
    font-size:clamp(26px,5.8cqw,73px);
    letter-spacing:.1em;
    line-height:1.16;
    white-space:nowrap;
    color:#F8F9FF;
    -webkit-text-stroke:0.6px rgba(53,66,104,.8);
    paint-order:stroke fill;
    text-shadow:none;
  }
  .sub{
    margin-top:clamp(7px,1.1cqw,15px);
    font-size:clamp(14px,2cqw,25px);
    letter-spacing:.24em;
    color:#E4E6EA;
    font-weight:600;
    text-shadow:
      0 0 2px rgba(23,42,84,.55),
      0 0 8px rgba(255,255,255,.85),
      0 0 22px rgba(255,255,255,.5);
  }
  .divider{
    display:flex;align-items:center;gap:clamp(8px,1.2cqw,14px);
    color:var(--gold);
    margin:clamp(10px,1.4cqw,18px) auto clamp(4px,.6cqw,8px);
    width:min(56%,50cqw);
  }
  .divider::before,.divider::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .divider span{font-size:clamp(12px,1.6cqw,20px);letter-spacing:.3em;}
  /* ---------- 上部：左人物大留白 右文字列 ---------- */
  .upper{flex:1;min-height:0;display:grid;grid-template-columns:54% 46%;gap:clamp(10px,1.5cqw,20px);margin-top:clamp(8px,1.2cqw,15px);}
  .artcol{min-width:0;}
  .textcol{display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.25cqw,15px);min-height:0;}
  /* ---------- 下部：右下两卡片，露出左下人物 ---------- */
  .lower{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:clamp(9px,1.3cqw,15px);margin-top:clamp(8px,1.2cqw,15px);}
  .lower .card{width:min(100%,42cqw);}
  /* ---------- 卡片 ---------- */
  .card{
    background:linear-gradient(145deg,rgba(246,246,252,.9),rgba(233,234,246,.8));
    backdrop-filter:blur(12px) saturate(1.08);
    -webkit-backdrop-filter:blur(12px) saturate(1.08);
    border:1px solid rgba(168,170,202,.4);
    border-radius:clamp(11px,1.7cqw,21px);
    padding:clamp(9px,1.4cqw,18px) clamp(12px,1.8cqw,23px);
    box-shadow:0 10px 24px rgba(22,59,112,.12);
  }
  .card h2{
    font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
    font-weight:700;
    font-size:clamp(14px,2.2cqw,27px);
    color:var(--gold-deep);
    letter-spacing:.18em;
    position:relative;
    padding-bottom:.32em;
  }
  .card h2::after{
    content:'';
    position:absolute;left:0;bottom:0;
    width:2.4em;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold-deep),transparent);
    opacity:.65;
  }
  .list{list-style:none;margin-top:clamp(5px,.75cqw,10px);display:flex;flex-direction:column;gap:clamp(3px,.5cqw,7px);}
  .list li{
    display:flex;gap:.7em;
    line-height:1.48;
    color:var(--text);
    font-weight:400;
    font-size:clamp(12px,1.5cqw,18px);
  }
  .list li .no{
    font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
    color:var(--num);
    font-weight:600;
    font-size:.9em;
    min-width:1.6em;text-align:right;flex-shrink:0;
    padding-top:.1em;
  }
  .keywords{display:flex;flex-wrap:wrap;gap:clamp(5px,.8cqw,10px);margin-top:clamp(5px,.75cqw,10px);}
  .keywords span{
    border:1px solid rgba(154,162,181,.6);
    border-radius:999px;
    padding:.34em 1em;
    font-size:clamp(11.5px,1.4cqw,16.5px);
    color:var(--text);
    background:rgba(250,251,253,.9);
    letter-spacing:.08em;
    font-weight:400;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(22,59,112,.07);
  }
  .insight{margin-top:clamp(5px,.75cqw,10px);}
  .insight p{
    position:relative;
    padding-left:1.15em;
    margin-top:clamp(3.5px,.55cqw,7px);
    line-height:1.5;
    color:var(--text);
    font-weight:400;
    font-size:clamp(11.8px,1.47cqw,18px);
    text-align:justify;
  }
  .insight p::before{
    content:'';
    position:absolute;left:.1em;top:.72em;
    width:.44em;height:.44em;border-radius:50%;

<script>
(() => {
  const viewer = document.querySelector(".report-viewer");
  const frame = document.querySelector("iframe");
  let height = 1920;
  function fit() {
    const scale = viewer.clientWidth / 1080;
    frame.style.transform = "scale(" + scale + ")";
    viewer.style.height = height * scale + "px";
  }
  frame.addEventListener("load", () => {
    const doc = frame.contentDocument;
    const poster = doc.querySelector(".poster");
    function measure() {
      height = Math.ceil(Math.max(poster.getBoundingClientRect().height, poster.scrollHeight));
      frame.style.height = height + "px";
      document.body.style.background = frame.contentWindow.getComputedStyle(doc.body).backgroundColor;
      fit();
    }
    new ResizeObserver(measure).observe(poster);
    doc.fonts.ready.then(measure);
    measure();
  });
  new ResizeObserver(fit).observe(viewer);
  fit();
})();
</script>
