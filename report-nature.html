&lt;body&gt;&lt;article class=&quot;poster&quot;&gt;&lt;div class=&quot;scene&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
&lt;header class=&quot;heading&quot;&gt;&lt;h1&gt;野生派大自然女儿&lt;/h1&gt;&lt;p&gt;生命力蓬勃 · IP天菜 · 野生活人感&lt;/p&gt;&lt;div class=&quot;ornament&quot; aria-hidden=&quot;true&quot;&gt;✦ ✧ ✦&lt;/div&gt;&lt;/header&gt;
&lt;main class=&quot;cards&quot;&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;核心关键词&lt;/h2&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag&quot;&gt;野生自由&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;外放鲜活&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;自由不羁&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;个人IP潜力&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;探索生命意义&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;天赋优势&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;span&gt;生命力蓬勃，喜欢探索广阔世界，自带温暖鲜活的感染力。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;span&gt;善于社交与表达，享受真实的当下体验，能与人建立自然连接。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;span&gt;忠于内心热爱，敢于走出自己的节奏，拥有个人表达与IP魅力。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;当下困境&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;span&gt;你向往自由，停留太久可能觉得受限；一直奔走，有时也会渴望安定。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;span&gt;新鲜体验让你感到鲜活，而生活归于平淡时，偶尔会有说不清的不安。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;span&gt;不断探索下一站的同时，也许会问自己：真正想追求的是什么？&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;成长建议&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;span&gt;试着在流动中建立内在的安定，让自由与扎根不必二选一。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;span&gt;温柔关注内心的不安，探索过往经历，让自己慢慢安住当下。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;span&gt;发挥表达天赋，沉淀个人经历，探索适合自己的个人IP与事业。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
&lt;section class=&quot;card insight&quot;&gt;&lt;h2&gt;阶段觉察指引&lt;/h2&gt;&lt;p&gt;你热爱新鲜与远方，也可能在奔走后，悄悄渴望一处可以安心停靠的地方。&lt;/p&gt;&lt;p&gt;自由不一定意味着永不停歇；即使身处流动之中，也可以慢慢找到属于自己的节奏和内在支点。&lt;/p&gt;&lt;p&gt;如果想探索生命意义、平衡自由与扎根，也可以了解灵性觉醒和个人IP打造相关内容。&lt;/p&gt;&lt;/section&gt;

</main>
<script>
(() => {
  const viewer = document.querySelector(".report-viewer");
  const frame = document.querySelector("iframe");
  let height = 1920;
  function fit() {
    const scale = viewer.clientWidth / 1080;
    frame.style.transform = "scale(" + scale + ")";
    viewer.style.height = height * scale + "px";
  }
  frame.addEventListener("load", () => {
    const doc = frame.contentDocument;
    const poster = doc.querySelector(".poster");
    function measure() {
      height = Math.ceil(Math.max(poster.getBoundingClientRect().height, poster.scrollHeight));
      frame.style.height = height + "px";
      document.body.style.background = frame.contentWindow.getComputedStyle(doc.body).backgroundColor;
      fit();
    }
    new ResizeObserver(measure).observe(poster);
    doc.fonts.ready.then(measure);
    measure();
  });
  new ResizeObserver(fit).observe(viewer);
  fit();
})();
</script>
</body>
